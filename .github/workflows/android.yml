name: RUOSS 3.2 Android
on:
  push:
    branches: ['release/ruoss-3.2']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check JavaScript syntax
        run: |
          python3 -c "from pathlib import Path; s=Path('app/src/main/assets/index.html').read_text(); Path('/tmp/training.js').write_text(s.split('<script>')[1].split('</script>')[0])"
          node --check /tmp/training.js
      - name: Verify mobile flows and stress cases
        run: |
          npm install --prefix "$RUNNER_TEMP/ruoss-tests" playwright@1.56.1
          "$RUNNER_TEMP/ruoss-tests/node_modules/.bin/playwright" install --with-deps chromium webkit
          NODE_PATH="$RUNNER_TEMP/ruoss-tests/node_modules" node tests/mobile.cjs
      - run: gradle assembleDebug bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: build-input
          retention-days: 1
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/release/app-release.aab
      - uses: actions/checkout@v4
        with:
          ref: 4a88293b4896f9d3f682376e6f88aef14eabcfe2
          path: baseline
      - name: Build previous app as an upgrade fixture
        working-directory: baseline
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: previous-test-build
          retention-days: 1
          path: baseline/app/build/outputs/apk/debug/app-debug.apk
  windows:
    needs: build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: build-input
          path: build-input
      - uses: actions/download-artifact@v4
        with:
          name: previous-test-build
          path: previous
      - name: Package and verify the Windows signing kit
        shell: powershell
        run: |
          $dir = 'pacchetto/strumenti'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $apk = Get-ChildItem build-input -Recurse -Filter *.apk
          $aab = Get-ChildItem build-input -Recurse -Filter *.aab
          Copy-Item $aab.FullName 'pacchetto/RUOSS-3.2-Play.aab'
          Copy-Item packaging/Prepara-APK.ps1,packaging/Prepara-APK.cmd,packaging/LEGGIMI.txt,packaging/dati-ruoss.py pacchetto
          Copy-Item "$env:ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" $dir
          Copy-Item "$env:ANDROID_HOME/platform-tools/adb.exe","$env:ANDROID_HOME/platform-tools/AdbWinApi.dll","$env:ANDROID_HOME/platform-tools/AdbWinUsbApi.dll" $dir
          jlink --add-modules java.base,java.logging,java.xml,jdk.crypto.ec,jdk.crypto.cryptoki,jdk.crypto.mscapi,jdk.localedata --no-header-files --no-man-pages --strip-debug --compress=2 --output "$dir/java"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory fixtures | Out-Null
          $prev = Get-ChildItem previous -Recurse -Filter *.apk
          Copy-Item $prev.FullName fixtures/originale.apk
          Copy-Item $prev.FullName "$dir/base.apk"
          & ./pacchetto/Prepara-APK.ps1
          Move-Item pacchetto/RUOSS-3.2.apk fixtures/predecessore.apk
          Copy-Item -Force $apk.FullName "$dir/base.apk"
          & ./pacchetto/Prepara-APK.ps1
          Move-Item pacchetto/RUOSS-3.2.apk fixtures/aggiornamento.apk
      - uses: actions/upload-artifact@v4
        with:
          name: emulator-fixtures
          retention-days: 1
          path: fixtures
      - uses: actions/upload-artifact@v4
        with:
          name: RUOSS-3.2-Android
          path: pacchetto/
          if-no-files-found: error
  upgrade:
    needs: windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: emulator-fixtures
          path: fixtures
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: bash packaging/verify-upgrade.sh
