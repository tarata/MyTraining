name: Build Android APK
on:
  push:
    branches: [main, 'release/ruoss-3.1']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check JavaScript syntax
        run: |
          python3 -c "from pathlib import Path; s=Path('app/src/main/assets/index.html').read_text(); Path('/tmp/training.js').write_text(s.split('<script>')[1].split('</script>')[0])"
          node --check /tmp/training.js
      - name: Verify mobile flows and stress cases
        run: |
          npm install --prefix "$RUNNER_TEMP/ruoss-tests" playwright@1.56.1
          "$RUNNER_TEMP/ruoss-tests/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/ruoss-tests/node_modules" node tests/mobile.cjs
      - run: gradle assembleDebug bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: RUOSS-3.1-Android
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
