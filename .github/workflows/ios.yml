name: RUOSS iOS
on:
  push:
    branches: ['release/ruoss-3.2']
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Check App Store SDK
        run: |
          xcodebuild -version
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iPhoneOS SDK $sdk"
          test "${sdk%%.*}" -ge 26
      - run: command -v xcodegen || brew install xcodegen
      - run: cd ios && xcodegen generate
      - run: xcodebuild -project ios/RUOSS.xcodeproj -scheme RUOSS -configuration Release -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: RUOSS-iOS-simulator
          path: build/Build/Products/Release-iphonesimulator/RUOSS.app
      - name: Build unsigned iPhone application
        run: xcodebuild -project ios/RUOSS.xcodeproj -scheme RUOSS -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath RUOSS.xcarchive CODE_SIGNING_ALLOWED=NO archive
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R RUOSS.xcarchive/Products/Applications/RUOSS.app Payload/
          ditto -c -k --keepParent RUOSS.xcarchive RUOSS-3.2.xcarchive.zip
          zip -qr RUOSS-3.2-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: RUOSS-iPhone-unsigned
          path: |
            RUOSS-3.2-unsigned.ipa
            RUOSS-3.2.xcarchive.zip
