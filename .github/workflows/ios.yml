name: RUOSS iOS
on:
  push:
    branches: ['ios/ruoss-3.0']
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: cd ios && xcodegen generate
      - run: xcodebuild -project ios/RUOSS.xcodeproj -scheme RUOSS -configuration Release -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: RUOSS-iOS-simulator
          path: build/Build/Products/Release-iphonesimulator/RUOSS.app
