let plans={A:[['Trazione libera',3,'1',180,'Recupero 150–180 s; singole pulite, usa elastico se necessario'],['Trazioni negative',3,'3',120,'Discesa 4–6 secondi'],['Squat / Hack squat',3,'6–8',120],['Panca piana bilanciere',3,'6–8',120],['Rematore manubrio',3,'8–10',90],['Alzate laterali',3,'12–15',60],['Curl manubri',2,'10–12',60],['Pushdown tricipiti',2,'10–12',60],['Cable crunch zavorrato',3,'10–15',60]],B:[['Trazioni con elastico',4,'3',120,'4×3 → 4×4 → 4×5; poi riduci assistenza e torna a 4×3'],['Stacco rumeno',3,'6–8',120],['Military/Shoulder press',3,'6–10',120,'Recupero 90–120 s'],['Leg press',3,'10–12',120,'Recupero 90–120 s'],['Panca inclinata manubri',3,'8–10',90],['Pulley basso',3,'8–12',90],['Alzate laterali',2,'15–20',60],['Curl bilanciere EZ',2,'10–12',60],['Estensioni tricipiti cavo',2,'10–12',60],['Hanging knee raise',3,'8–12',60,'Alternativa: reverse crunch 3×12–15']],C:[['Scapular pull-up',3,'6–8',90,'Recupero 60–90 s; evita cedimento'],['Lat machine',3,'8–10',90,'1–2 RIR'],['Bulgarian split squat',3,'8–10',90,'Per gamba'],['Chest press',3,'8–12',90],['Leg curl',3,'10–15',90],['Rematore chest-supported',3,'10–12',90],['Shoulder press manubri',2,'8–12',90],['Alzate laterali',2,'15–20',60],['Curl',2,'10–15',60,'Superset con pushdown'],['Pushdown',2,'10–15',60,'Superset con curl'],['Ab wheel / rollout',3,'6–10',90,'Recupero 60–90 s']]};
let s=JSON.parse(localStorage.getItem('training')||'null')||{day:'A',started:0,end:0,restName:'',draft:{},history:[],rests:{}};const originalPlans=JSON.parse(JSON.stringify(plans));if(s.customPlans)plans=s.customPlans;let view=s.day; s.drafts??={}; s.drafts[s.day]??=s.draft; s.draft=s.drafts[s.day];const save=()=>localStorage.setItem('training',JSON.stringify(s));const el=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function fmt(n,h=false){n=Math.max(0,n);return (h?String(Math.floor(n/3600)).padStart(2,'0')+':':'')+String(Math.floor(n/60)%60).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function start(){if(!s.started){if(!plans[view])return;s.day=view;s.started=Date.now();save();render()}}function finish(){if(!s.started)return;askFinish()}function saveFinish(){if(!s.started)return;s.history.push({day:s.day,date:new Date().toISOString(),duration:Math.floor((Date.now()-s.started)/1000),data:s.drafts[s.day]||{}});s.started=0;s.drafts[s.day]={};s.draft=s.drafts[s.day];s.end=0;try{Android.cancelRest()}catch(e){}save();render()}function stopRest(){try{Android.cancelRest()}catch(e){}s.end=0;save();tick()}function adjust(n){if(s.end){s.end=Math.max(Date.now(),s.end+n*1000);s.restTotal=Math.max(s.restTotal||1,Math.ceil((s.end-Date.now())/1000));try{Android.scheduleRest(s.end,s.restName)}catch(e){}save();tick()}}function rest(name,sec){if(!s.started&&plans[view]){s.day=view;s.started=Date.now();save()}sec=Math.max(0,Math.min(3600,Number(sec)||0));s.restTotal=sec;s.end=Date.now()+sec*1000;s.restName=name;try{Android.scheduleRest(s.end,name)}catch(e){}save();tick();window.scrollTo(0,0)}function tick(){document.body.classList.toggle('training',!!s.started);document.body.classList.toggle('recovering',!!s.end);el('clock').textContent=fmt(s.started?Math.floor((Date.now()-s.started)/1000):0,true);let n=s.end?Math.ceil((s.end-Date.now())/1000):0;el('rest').textContent=fmt(n);el('restbar').max=s.restTotal||1;el('restbar').value=Math.max(0,n);el('status').textContent=s.started?'SESSIONE IN CORSO · '+s.day:'PRONTO PER ALLENARTI';el('restName').textContent=s.end?s.restName:'Recupero';if(s.end&&n<=0){s.end=0;save();try{navigator.vibrate(500);let a=new AudioContext(),o=a.createOscillator();o.connect(a.destination);o.start();o.stop(a.currentTime+.4)}catch(e){}}}setInterval(tick,250);
function previous(name){for(let i=s.history.length-1;i>=0;i--){let d=s.history[i].data[name];if(d?.some(x=>x?.done))return d}return []}function select(v){focusIndex=-1;view=v;if(plans[v]){s.drafts[v]??={};s.draft=s.drafts[v];save()}render()}function update(i,j,k,v){if(s.started&&view!==s.day)return;let name=plans[view][i][0];s.draft[name]??=[];s.draft[name][j]??={};s.draft[name][j][k]=v;save()}function complete(i,j){if(s.started&&view!==s.day)return;let kg=el('kg'+i+'_'+j).value,r=el('rp'+i+'_'+j).value;if(r===''||!Number.isInteger(Number(r))||Number(r)<0||Number(kg)<0){notice('Controlla i valori','Inserisci ripetizioni intere e un peso non negativo.');return}if(!s.started){s.day=view;s.started=Date.now();save()}let [name,,target,sec]=plans[view][i];let old=s.draft[name]?.[j]||{};update(i,j,'kg',kg);update(i,j,'rep',r);update(i,j,'done',!old.done);if(!old.done&&!(view==='C'&&name==='Curl'&&!s.customPlans))rest(name,s.rests[view+i]??sec);render()}
let focusIndex=-1;function focusExercise(i){focusIndex=i;render();window.scrollTo(0,0)}function render(){el('nav').innerHTML=['A','B','C','H','P','S'].map(v=>'<button class="'+(v===view?'active':'')+'" onclick="select(\''+v+'\')">'+(v==='H'?'Storico':v==='P'?'Progressi':v==='S'?'Schede':v)+'</button>').join('');document.body.classList.remove('focused');if(view==='S'){showEditor();return}if(view==='P'){showProgress();return}if(view==='H'){showHistory();return}el('main').innerHTML=(s.started&&view!==s.day?'<div class="notice">ANTEPRIMA · Sessione '+s.day+' in corso <button onclick="select(s.day)">Torna alla sessione</button></div>':'')+'<h2>Scheda '+view+' — '+esc(s.customPlans?'Personalizzata':({A:'Forza + trazioni',B:'Volume + catena posteriore',C:'Ipertrofia + tecnica trazioni'}[view]))+'</h2><article>Riscaldamento 5–7 min <button onclick="rest(\'Riscaldamento\',300)">5 min</button> <button onclick="rest(\'Riscaldamento\',420)">7 min</button></article>'+plans[view].map(([name,count,target,sec,note],i)=>{let p=previous(name);let done=(s.draft[name]||[]).filter(x=>x?.done).length;return '<article data-exercise="'+i+'" class="'+(done===count?'complete':'')+'"><progress max="'+count+'" value="'+done+'"></progress><small>'+done+'/'+count+' serie</small><h3>'+esc(name)+'</h3><button class="focusBtn" onclick="focusExercise('+i+')">Modalità esercizio</button><small>'+count+' × '+target+' '+(note?' · '+esc(note):'')+'</small><p class="done">Ultima seduta: '+(p.filter(x=>x?.done).map(x=>esc(x.kg||'0')+' kg × '+esc(x.rep)+(x.assist?' ('+esc(x.assist)+')':'')).join(' / ')||'—')+'</p><div class="line">Recupero <input type="number" min="0" value="'+(s.rests[view+i]??sec)+'" onchange="s.rests[view+'+i+']=Math.max(0,Math.min(3600,Number(this.value)||0));save()"> sec <button onclick="rest(plans[view]['+i+'][0],s.rests[view+'+i+']??'+sec+')">Avvia</button></div>'+Array.from({length:count},(_,j)=>{let d=s.draft[name]?.[j]||{},old=p[j]||{};return '<div class="setrow"><b class="setnum">'+(j+1)+'</b><label>KG<input id="kg'+i+'_'+j+'" type="number" step="0.25" placeholder="kg" value="'+esc(d.kg??old.kg??plans[view][i][5]??'')+'" onchange="update('+i+','+j+',\'kg\',this.value)"></label><label>RIP.<input id="rp'+i+'_'+j+'" type="number" min="0" placeholder="rip." value="'+esc(d.rep??'')+'" onchange="update('+i+','+j+',\'rep\',this.value)"></label><button class="'+(d.done?'active':'')+'" onclick="complete('+i+','+j+')">'+(d.done?'✓':'Fatto')+'</button>'+(name.toLowerCase().includes('trazion')?'<input style="width:110px" placeholder="Elastico" value="'+esc(d.assist??old.assist??'')+'" onchange="update('+i+','+j+',\'assist\',this.value)">':'')+'</div>'}).join('')+'</article>'}).join('');if(focusIndex>=0){let cards=el('main').querySelectorAll('article');cards.forEach(x=>x.hidden=x.dataset.exercise!==String(focusIndex));let controls=document.createElement('div');controls.className='focusnav';controls.innerHTML='<button onclick="focusExercise(-1)">☰ Scheda</button><button onclick="focusExercise('+Math.max(0,focusIndex-1)+')">‹ Prec.</button><button onclick="focusExercise('+Math.min(plans[view].length-1,focusIndex+1)+')">Succ. ›</button>';el('main').prepend(controls)}document.body.classList.toggle('focused',focusIndex>=0);if(s.started&&view!==s.day)el('main').querySelectorAll('article input,article button').forEach(x=>x.disabled=true);tick()}function notice(title,body,confirm=false){el('messageTitle').textContent=title;el('messageBody').textContent=body;el('confirmSave').hidden=!confirm;el('message').showModal()}function askFinish(){notice('Termina allenamento','Vuoi salvare la sessione nello storico?',true)}let filters=['','',''];function removeHistory(i){if(s.started){notice('Allenamento in corso','Termina la sessione prima di cancellare lo storico.');return}el('deleteIndex').value=i;el('deleteDialog').showModal()}function deleteHistory(){s.history.splice(Number(el('deleteIndex').value),1);save();el('deleteDialog').close();showHistory()}function showHistory(){el('main').innerHTML='<h2>Storico allenamenti</h2><div class="filters">'+['Giorno','Mese','Anno'].map((n,i)=>'<label>'+n+'<input type="number" value="'+esc(filters[i])+'" onchange="filters['+i+']=this.value;showHistory()"></label>').join('')+'</div><button onclick="filters=[\'\',\'\',\'\'];showHistory()">Azzera filtri</button>'+(!s.history.length?'<article>Nessun allenamento salvato.</article>':s.history.map((h,i)=>({h,i})).reverse().filter(({h})=>{let d=new Date(h.date);return [d.getDate(),d.getMonth()+1,d.getFullYear()].every((v,i)=>!filters[i]||Number(filters[i])===v)}).map(({h,i})=>{let entries=Object.entries(h.data||{}).filter(([n,rows])=>rows.some(x=>x?.done));let count=entries.reduce((a,[n,rows])=>a+rows.filter(x=>x?.done).length,0);return '<article><div class="historyHead"><strong>SCHEDA '+esc(h.day)+'</strong><b>'+new Date(h.date).toLocaleDateString('it-IT')+'</b></div><p>'+fmt(h.duration,true)+' · '+count+' serie · '+entries.length+' esercizi</p><details><summary>Dettaglio allenamento</summary>'+entries.map(([n,rows])=>'<div class="historyExercise">'+esc(n)+'</div><table class="historyTable"><thead><tr><th>Serie</th><th>Kg</th><th>Rip.</th><th>Assistenza</th></tr></thead><tbody>'+rows.map((x,i)=>x?.done?'<tr><td>'+(i+1)+'</td><td>'+esc(x.kg||'0')+'</td><td>'+esc(x.rep)+'</td><td>'+esc(x.assist||'—')+'</td></tr>':'').join('')+'</tbody></table>').join('')+'</details><button class="danger" onclick="removeHistory('+i+')">Elimina allenamento</button></article>'}).join(''))}function showProgress(){let names=[...new Set([...Object.values(plans).flat().map(x=>x[0]),...s.history.flatMap(h=>Object.keys(h.data||{}))])];el('main').innerHTML='<h2>Progressi</h2><button onclick="exportCSV()">Esporta tutti i progressi CSV</button><article><label> Esercizio <select id="exercise" style="max-width:100%;padding:12px;background:#29394f;color:white" onchange="drawProgress()">'+names.map(n=>'<option>'+esc(n)+'</option>').join('')+'</select></label><div id="graph"></div></article>';drawProgress()}function drawProgress(){let name=el('exercise').value;let data=s.history.map(h=>({date:h.date,rows:(h.data[name]||[]).filter(x=>x?.done)})).filter(h=>h.rows.length);let g=el('graph');if(!data.length){g.textContent='Nessuna serie registrata.';return}let vals=data.map(h=>Math.max(...h.rows.map(x=>Number(x.kg)||0)));let max=Math.max(1,...vals);let pts=vals.map((v,i)=>[20+i*280/Math.max(1,vals.length-1),140-v/max*110]);g.innerHTML='<h3>Carico massimo per seduta</h3><p>Ultimo: '+vals.at(-1)+' kg · Record: '+Math.max(...vals)+' kg</p><svg viewBox="0 0 320 160"><path d="M20 140 H300" stroke="#8295ac"/><polyline fill="none" stroke="#51e0a1" stroke-width="3" points="'+pts.map(p=>p.join(',')).join(' ')+'"/>'+pts.map(p=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="#51e0a1"/>').join('')+'</svg>'+data.slice().reverse().map(h=>'<article><div class="progressDate">'+new Date(h.date).toLocaleDateString('it-IT')+'</div><table class="historyTable"><tr><th>Serie</th><th>Kg</th><th>Rip.</th><th>Assistenza</th></tr>'+h.rows.map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(x.kg||'0')+'</td><td>'+esc(x.rep)+'</td><td>'+esc(x.assist||'—')+'</td></tr>').join('')+'</table></article>').join('') }
function exportCSV(){let q=v=>'"'+String(v??'').replace(/^[=+@-]/,m=>"'"+m).replace(/"/g,'""')+'"';let rows=[['Data ISO','Scheda','Durata secondi','Esercizio','Serie','Kg','Ripetizioni','Assistenza']];s.history.forEach(h=>Object.entries(h.data||{}).forEach(([n,rr])=>rr.forEach((x,i)=>{if(x?.done)rows.push([h.date,h.day,h.duration,n,i+1,x.kg,x.rep,x.assist])})));Android.saveFile('RUOSS-progressi.csv','text/csv','\ufeff'+rows.map(r=>r.map(q).join(';')).join('\r\n'))}
let editor=null;function showEditor(){editor??=JSON.parse(JSON.stringify(plans));el('main').innerHTML='<h2>Gestione schede</h2><article><button onclick="template()">Scarica template JSON</button> <button onclick="Android.pickFile()">Importa scheda</button><p>Modifica gli esercizi, poi salva o condividi.</p></article>'+['A','B','C'].map(d=>'<article class="editor"><h3>Scheda '+d+'</h3>'+editor[d].map((x,i)=>'<div><label>Esercizio<input value="'+esc(x[0])+'" onchange="edit(\''+d+'\','+i+',0,this.value)"></label><div class="fields">'+[[1,'Serie'],[5,'Kg'],[2,'Rip.'],[3,'Rec. s']].map(([k,n])=>'<label>'+n+'<input value="'+esc(x[k]??'')+'" onchange="edit(\''+d+'\','+i+','+k+',this.value)"></label>').join('')+'</div><button onclick="editor[\''+d+'\'].splice('+i+',1);showEditor()">Rimuovi</button></div>').join('')+'<button onclick="editor[\''+d+'\'].push([\'Nuovo esercizio\',3,\'10\',60,\'\',0]);showEditor()">+ Esercizio</button></article>').join('')+'<button onclick="applyEditor()">Salva schede</button> <button onclick="shareEditor()">Condividi schede</button> <button onclick="editor=JSON.parse(JSON.stringify(originalPlans));showEditor()">Ripristina originali (anteprima)</button>'}
function edit(d,i,k,v){editor[d][i][k]=[1,3,5].includes(k)?Number(v):v}
function validate(p){let out={};for(let d of ['A','B','C']){if(!Array.isArray(p[d])||!p[d].length||p[d].length>50)throw Error('Scheda '+d+' non valida');let seen=new Set();out[d]=p[d].map(x=>{if(!Array.isArray(x)||typeof x[0]!=='string'||!x[0].trim()||x[0].length>120||seen.has(x[0].trim())||!Number.isInteger(+x[1])||+x[1]<1||+x[1]>30||!/^\\d+(?:[–-]\\d+)?$/.test(String(x[2]))||!Number.isFinite(+x[3])||+x[3]<0||+x[3]>3600||!Number.isFinite(+(x[5]??0))||+(x[5]??0)<0)throw Error('Controlla esercizi, serie, ripetizioni e recuperi in '+d);seen.add(x[0].trim());return [x[0].trim(),+x[1],String(x[2]),+x[3],String(x[4]??''),+(x[5]??0)]})}return out}
function template(){Android.saveFile('RUOSS-template.json','application/json',JSON.stringify({format:'RUOSS-1',plans:originalPlans},null,2))}
function importPlan(raw){try{let o=JSON.parse(raw);editor=validate(o.plans);select('S');notice('Scheda importata','Controlla gli esercizi e premi Salva schede per attivarla.')}catch(e){notice('File non valido',e.message)}}
function applyEditor(){if(s.started){notice('Sessione attiva','Termina prima di sostituire le schede.');return}try{plans=validate(editor);s.customPlans=plans;s.drafts={A:{},B:{},C:{}};s.draft=s.drafts[s.day];s.rests={};save();notice('Schede salvate','Lo storico precedente è conservato.')}catch(e){notice('Controlla la scheda',e.message)}}
function shareEditor(){try{Android.shareFile('RUOSS-schede.json','application/json',JSON.stringify({format:'RUOSS-1',plans:validate(editor)},null,2))}catch(e){notice('Controlla la scheda',e.message)}}render();
</script></html>
