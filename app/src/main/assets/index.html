    return date>=from&&date<to;
  });
  el('main').innerHTML='<h2>Storico allenamenti</h2><div class="periodPicker">'+periods.map((label,i)=>'<button class="'+(period===i?'active':'')+'" aria-pressed="'+(period===i)+'" onclick="period='+i+';showHistory()">'+label+'</button>').join('')+'</div>'+(!matches.length?'<article>Nessun allenamento nel periodo selezionato.</article>':matches.map(({h,i})=>{let entries=Object.entries(h.data||{}).filter(([n,rows])=>rows.some(x=>x?.done));let count=entries.reduce((a,[n,rows])=>a+rows.filter(x=>x?.done).length,0);return '<article><div class="historyHead"><strong>SCHEDA '+esc(h.day)+'</strong><b>'+new Date(h.date).toLocaleDateString('it-IT')+'</b></div><p>'+fmt(h.duration,true)+' · '+count+' serie · '+entries.length+' esercizi</p><details><summary>Dettaglio allenamento</summary>'+entries.map(([n,rows])=>'<div class="historyExercise">'+esc(n)+'</div><table class="historyTable"><thead><tr><th>Serie</th><th>Kg</th><th>Rip.</th><th>Assistenza</th></tr></thead><tbody>'+rows.map((x,i)=>x?.done?'<tr><td>'+(i+1)+'</td><td>'+esc(x.kg||'0')+'</td><td>'+esc(x.rep)+'</td><td>'+esc(x.assist||'—')+'</td></tr>':'').join('')+'</tbody></table>').join('')+'</details><button class="danger" onclick="removeHistory('+i+')">Elimina allenamento</button></article>'}).join(''))}function showProgress(){let names=[...new Set([...Object.values(plans).flat().map(x=>x[0]),...s.history.flatMap(h=>Object.keys(h.data||{}))])];el('main').innerHTML='<h2>Progressi</h2><button onclick="exportCSV()">Esporta</button><article><label> Esercizio <select id="exercise" style="max-width:100%;padding:12px;background:#29394f;color:white" onchange="drawProgress()">'+names.map(n=>'<option>'+esc(n)+'</option>').join('')+'</select></label><div id="graph"></div></article>';drawProgress()}function drawProgress(){let name=el('exercise').value;let data=s.history.map(h=>({date:h.date,rows:(h.data[name]||[]).filter(x=>x?.done)})).filter(h=>h.rows.length);let g=el('graph');if(!data.length){g.textContent='Nessuna serie registrata.';return}let vals=data.map(h=>Math.max(...h.rows.map(x=>Number(x.kg)||0)));let max=Math.max(1,...vals);let pts=vals.map((v,i)=>[20+i*280/Math.max(1,vals.length-1),140-v/max*110]);g.innerHTML='<h3>Carico massimo per seduta</h3><p>Ultimo: '+vals.at(-1)+' kg · Record: '+Math.max(...vals)+' kg</p><svg viewBox="0 0 320 160"><path d="M20 140 H300" stroke="#8295ac"/><polyline fill="none" stroke="#51e0a1" stroke-width="3" points="'+pts.map(p=>p.join(',')).join(' ')+'"/>'+pts.map(p=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="#51e0a1"/>').join('')+'</svg>'+data.slice().reverse().map(h=>'<article><div class="progressDate">'+new Date(h.date).toLocaleDateString('it-IT')+'</div><table class="historyTable"><tr><th>Serie</th><th>Kg</th><th>Rip.</th><th>Assistenza</th></tr>'+h.rows.map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(x.kg||'0')+'</td><td>'+esc(x.rep)+'</td><td>'+esc(x.assist||'—')+'</td></tr>').join('')+'</table></article>').join('') }
function exportCSV(){let q=v=>'"'+String(v??'').replace(/^[=+@-]/,m=>"'"+m).replace(/"/g,'""')+'"';let rows=[['Data ISO','Scheda','Durata secondi','Esercizio','Serie','Kg','Ripetizioni','Assistenza']];s.history.forEach(h=>Object.entries(h.data||{}).forEach(([n,rr])=>rr.forEach((x,i)=>{if(x?.done)rows.push([h.date,h.day,h.duration,n,i+1,x.kg,x.rep,x.assist])})));Android.saveFile('RUOSS-progressi.csv','text/csv','\ufeff'+rows.map(r=>r.map(q).join(';')).join('\r\n'))}

let editor=null, editorDay='A', exerciseIndex=0;
function changeEditorDay(day){editorDay=day;exerciseIndex=0;showEditor()}
function addExercise(){
  const rows=editor[editorDay];
  if(rows.length>=50)return;
  let number=rows.length+1;
  while(rows.some(row=>row[0]==='Esercizio '+number))number++;
  rows.push(['Esercizio '+number,3,'10',60,'',0]);
  exerciseIndex=rows.length-1;
  showEditor();
  el('exerciseName').focus();
  el('exerciseName').select();
}
function removeExercise(){
  editor[editorDay].splice(exerciseIndex,1);
  showEditor();
}
function resetEditor(){
  editor=JSON.parse(JSON.stringify(originalPlans));
  changeEditorDay('A');
  el('editorStatus').textContent='Originali caricati in anteprima. Premi Salva per applicarli.';
}
function showEditor(){
  editor??=JSON.parse(JSON.stringify(plans));
  const rows=editor[editorDay];
  exerciseIndex=Math.max(0,Math.min(rows.length-1,exerciseIndex));
  const row=rows[exerciseIndex];
  const fields=[[1,'Serie'],[5,'Kg'],[2,'Ripetizioni'],[3,'Recupero (s)']];
  el('main').innerHTML=`<h2>Gestione schede</h2>
    <div class="actionRow pair"><button onclick="template()">Scarica Template</button><button onclick="Android.pickFile()">Importa Scheda</button></div>
    <article class="editor"><div class="dayPicker">${['A','B','C'].map(day=>`<button class="${day===editorDay?'active':''}" onclick="changeEditorDay('${day}')">${day}</button>`).join('')}</div>
    <h3>Scheda ${editorDay}</h3>
    ${row?`<label>Esercizio ${exerciseIndex+1} di ${rows.length}<select id="exercisePicker" onchange="exerciseIndex=Number(this.value);showEditor()">${rows.map((item,i)=>`<option value="${i}" ${i===exerciseIndex?'selected':''}>${esc(item[0])}</option>`).join('')}</select></label>
    <label>Nome esercizio<input id="exerciseName" value="${esc(row[0])}" oninput="edit(0,this.value);el('exercisePicker').selectedOptions[0].textContent=this.value"></label>
    <div class="fields">${fields.map(([k,label])=>`<label>${label}<input value="${esc(row[k]??'')}" oninput="edit(${k},this.value)"></label>`).join('')}</div>
    <label>Note<input value="${esc(row[4]??'')}" oninput="edit(4,this.value)"></label>`:'<p>Aggiungi il primo esercizio.</p>'}
    <div class="actionRow pair"><button ${rows.length>=50?'disabled':''} onclick="addExercise()">+ Esercizio</button><button ${row?'':'disabled'} onclick="removeExercise()">Rimuovi</button></div></article>
    <div class="actionRow"><button onclick="applyEditor()">Salva</button><button onclick="shareEditor()">Condividi</button><button onclick="resetEditor()">Reset</button></div><p id="editorStatus" role="status"></p>`;
}
function edit(key,value){editor[editorDay][exerciseIndex][key]=value}
function validate(p){let out={};for(let d of ['A','B','C']){if(!Array.isArray(p[d])||!p[d].length||p[d].length>50)throw Error('Scheda '+d+' non valida');let seen=new Set();out[d]=p[d].map(x=>{if(!Array.isArray(x)||typeof x[0]!=='string'||!x[0].trim()||x[0].length>120||seen.has(x[0].trim())||!Number.isInteger(+x[1])||+x[1]<1||+x[1]>30||!/^\d+(?:[–-]\d+)?$/.test(String(x[2]))||!Number.isFinite(+x[3])||+x[3]<0||+x[3]>3600||!Number.isFinite(+(x[5]??0))||+(x[5]??0)<0)throw Error('Controlla esercizi, serie, ripetizioni e recuperi in '+d);seen.add(x[0].trim());return [x[0].trim(),+x[1],String(x[2]),+x[3],String(x[4]??''),+(x[5]??0)]})}return out}
function template(){Android.saveFile('RUOSS-template.json','application/json',JSON.stringify({format:'RUOSS-1',plans:originalPlans},null,2))}
function importPlan(raw){try{let o=JSON.parse(raw);editor=validate(o.plans);editorDay='A';exerciseIndex=0;select('S');notice('Scheda importata','Controlla gli esercizi e premi Salva per attivarla.')}catch(e){notice('File non valido',e.message)}}
function applyEditor(){if(s.started){notice('Sessione attiva','Termina prima di sostituire le schede.');return}try{const updated=validate(editor);
  const drafts={A:{},B:{},C:{}};
  const next={...s,customPlans:updated,drafts,draft:drafts[s.day],rests:{}};
  localStorage.setItem('training',JSON.stringify(next));
  plans=updated;s=next;el('editorStatus').textContent='Schede salvate.'}catch(e){notice('Controlla la scheda',e.message)}}
function shareEditor(){try{Android.shareFile('RUOSS-schede.json','application/json',JSON.stringify({format:'RUOSS-1',plans:validate(editor)},null,2))}catch(e){notice('Controlla la scheda',e.message)}}if (window.Android && typeof Android.copyPushToken === 'function') document.getElementById('pushToken').hidden=false;
render();
</script></html>
